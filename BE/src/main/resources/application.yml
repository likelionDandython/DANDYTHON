server:
  port: ${PORT:8080}   # 배포 서버가 PORT를 주면 그걸 쓰고, 로컬은 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-must-be-at-least-32-bytes-long!!}
  expiration-ms: 86400000   # 24시간

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

llm:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
    timeout: ${GEMINI_TIMEOUT:10s}
    min-memo-length: ${SUMMARY_MIN_MEMO_LENGTH:20}

notification:
  delivery:
    enabled: ${PUSH_DELIVERY_ENABLED:true}
    poll-delay-ms: ${PUSH_DELIVERY_POLL_DELAY_MS:1000}
  firebase:
    enabled: ${FCM_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}
    credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
    connect-timeout: ${FCM_CONNECT_TIMEOUT:3s}
    read-timeout: ${FCM_READ_TIMEOUT:5s}
    write-timeout: ${FCM_WRITE_TIMEOUT:5s}
